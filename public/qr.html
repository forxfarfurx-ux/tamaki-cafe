<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>かぷー喫茶 QR</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff8ed; margin: 0; color: #3a2a1d; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
    .card { background: #fff; border-radius: 22px; padding: 22px; box-shadow: 0 10px 30px rgba(80,45,15,.12); text-align: center; }
    h1 { margin: 0 0 8px; }
    .sub { color: #7a6250; margin-bottom: 18px; line-height: 1.7; }
    .qrbox { display: inline-block; background: white; padding: 16px; border: 1px solid #ead7c4; border-radius: 18px; margin: 12px 0; }
    img { width: 300px; height: 300px; }
    .url { font-size: 15px; background: #fff4df; border-radius: 14px; padding: 12px; margin: 14px auto; max-width: 620px; word-break: break-all; }
    select, button { font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid #decbb8; margin: 8px; }
    button { border: none; background: #7b4a24; color: white; font-weight: 800; cursor: pointer; }
    .note { text-align: left; background: #f6f7fb; border-radius: 16px; padding: 14px; margin-top: 18px; line-height: 1.8; color: #445; }
    a { color: #7b4a24; font-weight: 800; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>☕ かぷー喫茶 QRコード</h1>
      <div class="sub">
        このQRをみーちゃんのスマホで読み取ると、注文画面が開きます。
      </div>

      <div>
        <label>使うURL候補：</label>
        <select id="urlSelect" onchange="updateQR()"></select>
        <button onclick="updateQR()">QR更新</button>
      </div>

      <div class="qrbox">
        <img id="qr" alt="注文画面のQRコード">
      </div>

      <div id="urlText" class="url"></div>

      <p>
        <a href="/admin.html">注文管理画面へ</a>
      </p>

      <div class="note">
        <strong>うまく開かない場合：</strong><br>
        1. スマホが同じWi-Fiか確認<br>
        2. スマホを機内モードON → Wi-FiだけONにして読み取り<br>
        3. QRで開けない場合は、Wi-Fiルーターが「端末同士の通信」を止めている可能性があります
      </div>
    </div>
  </div>

  <script>
    async function init() {
      const res = await fetch("/api/info");
      const info = await res.json();
      const select = document.getElementById("urlSelect");

      info.urls.forEach((u, index) => {
        const opt = document.createElement("option");
        opt.value = u.orderUrl;
        opt.textContent = u.orderUrl;
        select.appendChild(opt);
      });

      updateQR();
    }

    function updateQR() {
      const url = document.getElementById("urlSelect").value;
      document.getElementById("urlText").textContent = url;
      document.getElementById("qr").src = "/api/qr?url=" + encodeURIComponent(url) + "&t=" + Date.now();
    }

    init();
  </script>
</body>
</html>
