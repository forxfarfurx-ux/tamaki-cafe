<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>たまき珈琲店</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #140f12;
      margin: 0;
      color: #f6ead8;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
    }
    .card {
      background: linear-gradient(180deg, #2a1b16, #17100f);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      border: 1px solid rgba(218, 176, 104, .35);
    }
    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      color: #f4cf88;
    }
    .sub {
      color: #d8b98b;
      margin-bottom: 20px;
    }
    .menu-note {
      background: rgba(255, 244, 223, .1);
      border: 1px solid rgba(244, 207, 136, .25);
      border-radius: 16px;
      padding: 12px;
      margin: 18px 0;
      line-height: 1.7;
      color: #f3dfc1;
    }
    .menu-list {
      background: rgba(255,255,255,.06);
      border-radius: 16px;
      padding: 12px;
      margin: 18px 0;
      line-height: 1.8;
      font-size: 15px;
    }
    label {
      display: block;
      font-weight: 700;
      margin-top: 18px;
      margin-bottom: 8px;
      color: #f4cf88;
    }
    select, textarea {
      width: 100%;
      box-sizing: border-box;
      font-size: 17px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #7d5a34;
      background: #fffdf9;
      color: #3a2a1d;
    }
    textarea {
      min-height: 88px;
      resize: vertical;
    }
    button {
      width: 100%;
      border: none;
      margin-top: 22px;
      padding: 16px;
      border-radius: 999px;
      background: #b47a32;
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
    button:active {
      transform: translateY(1px);
    }
    button:disabled {
      background: #76685b;
      cursor: not-allowed;
    }
    .spell {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(244, 207, 136, .25);
      line-height: 1.7;
      color: #ffe6b3;
      font-weight: 700;
    }
    .done {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      background: #e9ffe6;
      color: #285b24;
      font-weight: 700;
      line-height: 1.7;
    }
    .tiny {
      font-size: 13px;
      color: #b89b76;
      margin-top: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>☕ たまき珈琲店</h1>
      <div class="sub">台所支店・夜の小さな注文所</div>

      <div class="menu-note">
        店長が気まぐれに確認します。<br>
        たまき成分は予告なく付属します。
      </div>

      <div class="menu-list">
        <strong>本日のメニュー</strong><br>
        たまきブレンド　100 TAMA<br>
        月あかりラテ　300 TAMA<br>
        たまきミルクラテ　300 TAMA<br>
        気まぐれ甘味　300 TAMA<br>
        予約ソーセージ　500 TAMA
      </div>

      <label>メニュー</label>
      <select id="item">
        <option value="たまきブレンド" data-price="100">たまきブレンド　100 TAMA</option>
        <option value="月あかりラテ" data-price="300">月あかりラテ　300 TAMA</option>
        <option value="たまきミルクラテ" data-price="300">たまきミルクラテ　300 TAMA</option>
        <option value="気まぐれ甘味" data-price="300">気まぐれ甘味　300 TAMA</option>
        <option value="予約ソーセージ" data-price="500">予約ソーセージ　500 TAMA</option>
      </select>

      <label>温度</label>
      <select id="temperature">
        <option>ホット</option>
        <option>アイス</option>
        <option>なし</option>
      </select>

      <label>砂糖</label>
      <select id="sugar">
        <option>なし</option>
        <option>シュガー</option>
        <option>シュガー多め</option>
      </select>

      <label>ラテアート</label>
      <select id="latteArt">
        <option>なし</option>
        <option>ラテアート</option>
      </select>

      <label>たまき添え</label>
      <select id="tamaki">
        <option>たまき添え</option>
        <option>なし</option>
      </select>

      <label>ひとこと</label>
      <textarea id="note" placeholder="例：急ぎでお願いします / 今日はやさしめで"></textarea>

      <button id="orderButton" onclick="sendOrder()">注文する</button>

      <div id="spell" class="spell"></div>

      <div id="done" class="done">
        注文を送信しました。<br>
        たまき店長が気まぐれに準備中です。
      </div>

      <div class="tiny">tama_cafe v0.3</div>
    </div>
  </div>

  <script>
    function pickRandomEffect() {
      const effects = [
        "夜ふかし仕様",
        "二日酔い対策",
        "ねむねむ仕様",
        "店長ごきげん仕様",
        "月光補正",
        "ぽかぽか強化",
        "猫圧強め",
        "肉球監修",
        "秘密の深夜補正"
      ];
      return effects[Math.floor(Math.random() * effects.length)];
    }

    function buildSpell(item, temperature, sugar, latteArt, tamaki, effect) {
      return item + temperature + sugar + latteArt + tamaki + effect;
    }

    async function sendOrder() {
      const itemSelect = document.getElementById("item");
      const selectedOption = itemSelect.options[itemSelect.selectedIndex];

      const item = selectedOption.value;
      const price = selectedOption.dataset.price;
      const temperature = document.getElementById("temperature").value;
      const sugar = document.getElementById("sugar").value;
      const latteArt = document.getElementById("latteArt").value;
      const tamaki = document.getElementById("tamaki").value;
      const note = document.getElementById("note").value;
      const effect = pickRandomEffect();
      const spell = buildSpell(item, temperature, sugar, latteArt, tamaki, effect);

      const order = {
        item: spell,
        size: price + " TAMA",
        sugar: sugar,
        milk: latteArt + " / " + tamaki,
        note: "元の注文：" + item + "\n温度：" + temperature + "\n価格：" + price + " TAMA\n付与効果：" + effect + "\nひとこと：" + note
      };

      const button = document.getElementById("orderButton");
      button.disabled = true;
      button.textContent = "送信中です…";

      const res = await fetch("/api/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order)
      });

      if (res.ok) {
        document.getElementById("spell").innerHTML =
          "☕ ご注文の呪文<br><br>" +
          spell +
          "<br><br>" +
          price + " TAMA<br>" +
          "付与効果：" + effect;
        document.getElementById("spell").style.display = "block";
        document.getElementById("done").style.display = "block";
        button.textContent = "注文済みです";
      } else {
        button.disabled = false;
        button.textContent = "注文する";
        alert("注文に失敗しました。店主を呼んでください。");
      }
    }
  </script>
</body>
</html>
