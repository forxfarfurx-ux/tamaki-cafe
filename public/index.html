<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>かぷー喫茶</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff8ed; margin: 0; color: #3a2a1d; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 24px; }
    .card { background: #fff; border-radius: 22px; padding: 22px; box-shadow: 0 10px 30px rgba(80,45,15,.12); }
    h1 { font-size: 28px; margin: 0 0 8px; }
    .sub { color: #7a6250; margin-bottom: 20px; }
    label { display: block; font-weight: 700; margin-top: 18px; margin-bottom: 8px; }
    select, textarea { width: 100%; box-sizing: border-box; font-size: 17px; padding: 12px; border-radius: 14px; border: 1px solid #decbb8; background: #fffdf9; }
    textarea { min-height: 88px; resize: vertical; }
    button { width: 100%; border: none; margin-top: 22px; padding: 16px; border-radius: 999px; background: #7b4a24; color: white; font-size: 18px; font-weight: 800; cursor: pointer; }
    button:active { transform: translateY(1px); }
    .done { display: none; margin-top: 18px; padding: 14px; border-radius: 16px; background: #e9ffe6; color: #285b24; font-weight: 700; line-height: 1.6; }
    .menu-note { background: #fff4df; border-radius: 16px; padding: 12px; margin: 18px 0; line-height: 1.7; }
    .tiny { font-size: 13px; color: #806a58; margin-top: 18px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>☕ かぷー喫茶</h1>
      <div class="sub">台所支店・本日のメニュー</div>
      <div class="menu-note">店主はコーヒーしか作れません。<br>たまき成分は気まぐれで付属します。</div>

      <label>メニュー</label>
      <select id="item">
        <option>ホットコーヒー</option>
        <option>アイスコーヒー</option>
        <option>カフェオレっぽいもの</option>
        <option>水</option>
      </select>

      <label>サイズ</label>
      <select id="size">
        <option>普通</option>
        <option>多め</option>
        <option>ちょっとだけ</option>
      </select>

      <label>砂糖</label>
      <select id="sugar">
        <option>なし</option>
        <option>あり</option>
        <option>多め</option>
      </select>

      <label>ミルク</label>
      <select id="milk">
        <option>なし</option>
        <option>あり</option>
        <option>多め</option>
      </select>

      <label>ひとこと</label>
      <textarea id="note" placeholder="例：急ぎでお願いします / たまきを添えてください"></textarea>

      <button onclick="sendOrder()">注文する</button>

      <div id="done" class="done">注文を送信しました。<br>店主かぷーが豆の精霊と相談しています。</div>
      <div class="tiny">Kapoo Cafe v0.2</div>
    </div>
  </div>

  <script>
    async function sendOrder() {
      const order = {
        item: document.getElementById("item").value,
        size: document.getElementById("size").value,
        sugar: document.getElementById("sugar").value,
        milk: document.getElementById("milk").value,
        note: document.getElementById("note").value
      };

      const res = await fetch("/api/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order)
      });

      if (res.ok) {
        document.getElementById("done").style.display = "block";
      } else {
        alert("注文に失敗しました。店主を呼んでください。");
      }
    }
  </script>
</body>
</html>
